id = "local.codex-fork-from-message"
name = "Agent Fork from Message"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Fork the focused Codex or Claude session and open its native message picker"
platforms = ["macos", "linux"]

[[actions]]
id = "fork"
title = "Fork agent from message"
description = "Fork the focused Codex or Claude session and choose an earlier user message"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py"]

[[actions]]
id = "fork-pane"
title = "Fork agent beside current pane"
description = "Fork the focused Codex or Claude session into a side-by-side pane"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py", "--destination", "pane"]

[[actions]]
id = "fork-workspace"
title = "Fork agent into new workspace"
description = "Fork the focused Codex or Claude session into a new Herdr workspace"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py", "--destination", "workspace"]
