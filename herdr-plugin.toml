id = "seungwonme.panel-fork"
name = "Panel Fork"
version = "0.5.0"
min_herdr_version = "0.9.5"
description = "Native conversation forks into a new Herdr panel for Claude, Codex, OMP and GJC"
platforms = ["macos", "linux"]

[[actions]]
id = "fork"
title = "Panel Fork (오른쪽)"
description = "Fork the current conversation into a new panel with native agent permissions"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py", "--destination", "pane"]

[[actions]]
id = "fork-down"
title = "Panel Fork (아래)"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py", "--direction", "down"]

[[actions]]
id = "fork-tab"
title = "Panel Fork (새 탭)"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py", "--destination", "tab"]

[[actions]]
id = "read-only"
title = "Panel Fork (읽기 전용)"
description = "Optional restricted fork; not the default Panel Fork action"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py", "--mode", "read-only"]

[[actions]]
id = "from-message"
title = "Panel Fork from Message (Claude/Codex)"
contexts = ["pane"]
command = ["python3", "scripts/fork_from_message.py", "--mode", "message"]
